name: update-casks

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-casks
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh casks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tool/update_casks.py

      - name: Commit
        run: |
          if git diff --quiet; then
            echo 'All casks are current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks
          git commit -m 'Update casks from the latest releases'
          git push
